<style id="poltik-structural-fallback">
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&display=swap');
/* More consistently crushed, humanized Poltik-like fallback. */
.poltikish,
.mode-name,.modebtn-name,.badge,.tag,#toggleTimer,#forecastBtn,#current,#modeName,.panel-title .poltikish-inline,.sub.poltikish{
  font-family:"Oxanium","Arial Narrow","Arial Black",sans-serif !important;
  font-weight:700 !important;
  letter-spacing:-.075em !important;
  display:inline-block;
  transform:scaleX(1.22) scaleY(.70);
  transform-origin:center;
  line-height:.82 !important;
  font-stretch:expanded;
  filter:url(#poltik-horizontal-emphasis-soft);
  text-rendering:geometricPrecision;
}
.mode-name{font-size:55px !important;}
.modebtn-name{font-size:26px !important;}
.badge,.tag{letter-spacing:-.04em !important; transform:scaleX(1.18) scaleY(.68);}
.sub.poltikish{letter-spacing:-.06em !important;}
#forecastBtn{transform:scaleX(1.14) scaleY(.76);}
#toggleTimer{transform:scaleX(1.14) scaleY(.78);}
#current{transform:scaleX(1.18) scaleY(.72);}
.panel-title .poltikish-inline{font-size:1em !important;}
/* Japanese and body copy stay readable and unchanged. */
.identity,.tiny,.mini,.mode-sub,.field,.item,.body,.meta,.label,.input,.textarea,.select,.action,.chip,.copy,.primary,.secondary,.ghost,.close{
  filter:none !important;
  transform:none !important;
  font-family:inherit !important;
  letter-spacing:normal !important;
}
</style>


<style id="sensory-forecast-readability-fix">

  font-weight:700 !important;
  letter-spacing:-.025em !important;
  line-height:1 !important;
  transform:scaleX(1.035) scaleY(.82) !important;

  padding-left:4px !important;

}

.teacher-panel .panel-title.poltikish{
  font-family:"Oxanium","Arial Narrow","Arial Black",sans-serif !important;

}
</style>

      <section class="teacher-panel"><div class="panel-title"><span class="poltikish-inline">REJOIN BOX</span>へ送る</div><div class="field"><label>送信先</label><div id="targetLabel" class="input">生徒を選択</div></div><div class="field"><label>種類</label><select class="select" id="sendType"><option>要約</option><option>資料</option><option>リンク</option><option>連絡</option></select></div><div class="field"><label>タイトル</label><input class="input" id="sendTitle" placeholder="例：10:20〜10:27の要点"></div><div class="field"><label>本文</label><textarea class="textarea" id="sendBody"></textarea></div><div class="field"><label>URL（任意・アプリ内に表示）</label><input class="input" id="sendUrl" inputmode="url"></div><div class="field"><label>ファイル（任意・小さいPDF/画像）</label><input class="input" id="sendFile" type="file"></div><button class="primary wide" id="sendToStudent">選択中の生徒へ送る</button></section></div>
      <div class="teacher-grid"><section class="teacher-panel"><div class="panel-title">SHIFT履歴</div><div id="history"></div></section><section class="teacher-panel"><div class="panel-title">送信済み</div><div id="sent"></div></section></div>
    </main></div>
  </section>
</div>

<div class="sheet" id="teacherMsgSheet"><div class="sheet-card"><div class="sheet-title">先生から</div><div id="teacherMsgContent"></div><button class="close" data-close>閉じる</button></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const SESSION='shift-class-public-session-v6',ROSTERBASE='shift-class-public-roster-v6:';let role='student',session=null,state=null,secs=180,timerId=null,selectedStim=new Set(),selectedStudent=null;
const modes={LIVE:{icon:'🟢',sub:'通常授業',label:'🟢 LIVE'},FILTER:{icon:'🎧',sub:'刺激を減らす',label:'🎧 FILTER'},RESET:{icon:'🌙',sub:'一度離れる',label:'🌙 RESET'},REJOIN:{icon:'🔄',sub:'授業に戻る',label:'🔄 REJOIN'}};
const MEMORY_STORE={};function read(k,d){try{const v=localStorage.getItem(k);return v==null?(k in MEMORY_STORE?MEMORY_STORE[k]:d):JSON.parse(v)}catch{return k in MEMORY_STORE?MEMORY_STORE[k]:d}}function write(k,v){MEMORY_STORE[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function removeKey(k){delete MEMORY_STORE[k];try{localStorage.removeItem(k)}catch{}}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function fmt(ts){return new Date(ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}function C(){return session?.classCode||''}function U(){return session?.uid||''}function kState(uid=U()){return`shift-class-public-v6:${C()}:state:${uid}`}function kHistory(uid=U()){return`shift-class-public-v6:${C()}:history:${uid}`}function kMsgs(uid=U()){return`shift-class-public-v6:${C()}:messages:${uid}`}function kForecast(){return`shift-class-public-v6:${C()}:forecast`}function kRoster(){return ROSTERBASE+C()}
function showView(which){['loginView','studentView','teacherView'].forEach(id=>$(id).classList.add('hidden'));$(which).classList.remove('hidden')}
function switchAccount(){clearInterval(timerId);timerId=null;session=null;removeKey(SESSION);showView('loginView')}
document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=switchAccount);
async function shareApp(){const data={title:'SHIFT CLASS',text:'授業の受け方を、その時の自分に合わせてSHIFTするプロトタイプです。',url:location.href};try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(location.href);toast('URLをコピーしました')}}catch(e){if(e?.name!=='AbortError')toast('共有できませんでした')}}
document.querySelectorAll('[data-share]').forEach(b=>b.onclick=shareApp);$('shareLogin').onclick=shareApp;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b))});
function enterClass(useDefaults=false){
  const name=useDefaults?(role==='student'?'生徒A':'先生A'):($('loginName').value.trim()||(role==='student'?'生徒A':'先生A'));
  const classCode=useDefaults?'DEMO-CLASS':($('classCode').value.trim().toUpperCase().replace(/\s+/g,'-')||'DEMO-CLASS');
  const uid='u_'+role+'_'+name.replace(/\s+/g,'_')+'_'+classCode;
  session={uid,name,role,classCode,loginAt:Date.now()};
  write(SESSION,session);
  if(role==='student'){
    let roster=read(kRoster(),[]);
    if(!roster.some(x=>x.uid===uid)){roster.push({uid,name,joinedAt:Date.now()});write(kRoster(),roster)}
    openStudent();
  }else openTeacher();
}
$('googleDemo').onclick=()=>enterClass(true);
$('enter').onclick=()=>enterClass(false);
function openStudent(){showView('studentView');$('studentIdentity').textContent=session.name+' · '+C();state=read(kState(),{uid:U(),student:session.name,mode:'LIVE',filters:{noise:false,seat:false,screen:false},updatedAt:Date.now()});applyStudent()}
function logMode(m){let h=read(kHistory(),[]);h.unshift({mode:m,time:Date.now()});write(kHistory(),h.slice(0,30))}function syncState(){state.updatedAt=Date.now();write(kState(),state)}
function applyStudent(){const m=modes[state.mode]?state.mode:'LIVE';$('modeName').textContent=m;$('modeIcon').textContent=modes[m].icon;$('modeSub').textContent=modes[m].sub;document.querySelectorAll('.shift').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('show'));if(m==='FILTER')$('filterDrawer').classList.add('show');if(m==='RESET')$('resetDrawer').classList.add('show');if(m==='REJOIN'){$('rejoinDrawer').classList.add('show');renderRejoin()}document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',!!state.filters[b.dataset.filter]))}
function setMode(m){state.mode=m;syncState();logMode(m);applyStudent();toast(m+'へSHIFT')};document.querySelectorAll('.shift').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const f=b.dataset.filter;state.filters[f]=!state.filters[f];syncState();applyStudent();toast(f==='seat'?'席変更を先生へ共有':'FILTERを切替')});
function timerText(){$('timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}$('minusMin').onclick=()=>{secs=Math.max(60,secs-60);timerText()};$('plusMin').onclick=()=>{secs=Math.min(1800,secs+60);timerText()};$('toggleTimer').onclick=()=>{if(timerId){clearInterval(timerId);timerId=null;$('toggleTimer').textContent='START';return}$('toggleTimer').textContent='PAUSE';timerId=setInterval(()=>{secs--;timerText();if(secs<=0){clearInterval(timerId);timerId=null;$('toggleTimer').textContent='START';secs=180;timerText();setMode('REJOIN')}},1000)};
function itemHtml(x){let extra='';if(x.url)extra+=`<div class="urlbox">${esc(x.url)}</div><button class="copy" data-copy="${esc(x.url)}">URLをコピー</button>`;if(x.file?.data)extra+=`<div class="urlbox">添付: ${esc(x.file.name||'ファイル')}</div>`;return `<div class="item"><div class="item-title">${esc(x.title||'先生から')}</div><div class="meta">${esc(x.typeLabel||'資料')} · ${esc(x.time||'')}</div><div class="body">${esc(x.body||'')}</div>${extra}</div>`}
function bindCopies(root){root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast('URLをコピーしました')}catch{toast('コピーできませんでした')}})}function renderRejoin(){const a=read(kMsgs(),[]);$('rejoinStack').innerHTML=a.length?a.map(itemHtml).join(''):'<div class="empty">先生からの資料はまだありません</div>';bindCopies($('rejoinStack'))}
$('forecastBtn').onclick=()=>{
  const box=$('forecastInline'),drawer=$('forecastDrawer');
  const a=read(kForecast(),[]);
  box.innerHTML=a.length?a.map(x=>`<div class="item"><div class="item-title">${esc(x.className)}</div><div class="body">${(x.stimuli||[]).map(esc).join('　')||'登録なし'}</div></div>`).join(''):'<div class="empty">予報はまだありません</div>';
  const opening=!drawer.classList.contains('show');
  document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('show'));
  if(opening){drawer.classList.add('show');drawer.scrollIntoView({behavior:'smooth',block:'nearest'});}
};$('teacherMsgBtn').onclick=()=>{$('teacherMsgContent').innerHTML=read(kMsgs(),[]).length?read(kMsgs(),[]).map(itemHtml).join(''):'<div class="empty">まだ届いていません</div>';bindCopies($('teacherMsgContent'));$('teacherMsgSheet').classList.add('show')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').classList.remove('show'));
function openTeacher(){showView('teacherView');$('teacherIdentity').textContent=session.name+' · '+C();selectedStudent=null;renderRoster();renderTeacherAll()}
function renderRoster(){const list=read(kRoster(),[]);$('roster').innerHTML=list.length?list.map(s=>`<button class="studentbtn ${selectedStudent?.uid===s.uid?'on':''}" data-uid="${esc(s.uid)}">${esc(s.name)}</button>`).join(''):'<div class="empty">まだ参加者はいません</div>';document.querySelectorAll('[data-uid]').forEach(b=>b.onclick=()=>{selectedStudent=list.find(s=>s.uid===b.dataset.uid);renderRoster();renderTeacherAll()});if(!selectedStudent&&list[0]){selectedStudent=list[0];renderRoster();renderTeacherAll()}}
function renderTeacherAll(){renderStatus();renderHistory();renderSent()}function renderStatus(){if(!selectedStudent){$('studentName').textContent='生徒を選択';$('current').textContent='—';$('support').innerHTML='';$('request').classList.remove('show');$('targetLabel').textContent='生徒を選択';return}const s=read(kState(selectedStudent.uid),{mode:'LIVE',filters:{}});$('studentName').textContent=selectedStudent.name;$('current').textContent=modes[s.mode]?.label||'🟢 LIVE';$('support').innerHTML=s.mode==='FILTER'?'<span class="pill">FILTER使用中</span>':s.mode==='RESET'?'<span class="pill">教室外</span>':'';$('request').classList.toggle('show',!!s.filters?.seat);$('targetLabel').textContent=selectedStudent.name}
function renderHistory(){if(!selectedStudent){$('history').innerHTML='<div class="empty">生徒を選択してください</div>';return}const a=read(kHistory(selectedStudent.uid),[]);$('history').innerHTML=a.length?a.map(x=>`<div class="history-row"><strong>${modes[x.mode]?.label||esc(x.mode)}</strong><br><span class="tiny">${fmt(x.time)}</span></div>`).join(''):'<div class="empty">まだSHIFTしていません</div>'}function renderSent(){if(!selectedStudent){$('sent').innerHTML='<div class="empty">生徒を選択してください</div>';return}const a=read(kMsgs(selectedStudent.uid),[]);$('sent').innerHTML=a.length?a.map(x=>`<div class="sent"><strong>${esc(x.title)}</strong><br><span class="tiny">${esc(x.typeLabel)} · ${esc(x.time)}</span></div>`).join(''):'<div class="empty">まだ送信していません</div>'}
document.querySelectorAll('[data-stim]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?selectedStim.add(b.dataset.stim):selectedStim.delete(b.dataset.stim)});$('publishForecast').onclick=()=>{const cls=$('forecastClass').value.trim()||'今日の授業';let a=read(kForecast(),[]);a.unshift({id:Date.now(),className:cls,stimuli:[...selectedStim]});write(kForecast(),a.slice(0,8));$('forecastClass').value='';selectedStim.clear();document.querySelectorAll('[data-stim]').forEach(b=>b.classList.remove('on'));toast('SENSORY FORECASTを送りました')};
function dataUrl(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>1200000)return reject(new Error('ファイルが大きすぎます'));const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
$('sendToStudent').onclick=async()=>{if(!selectedStudent){toast('生徒を選択してください');return}const file=$('sendFile').files[0],body=$('sendBody').value.trim(),url=$('sendUrl').value.trim();if(!body&&!url&&!file){toast('本文・URL・ファイルを追加');return}try{const fd=await dataUrl(file);let a=read(kMsgs(selectedStudent.uid),[]);a.unshift({id:Date.now(),typeLabel:$('sendType').value,title:$('sendTitle').value.trim()||$('sendType').value,body,url,file:fd,time:fmt(Date.now())});write(kMsgs(selectedStudent.uid),a.slice(0,20));$('sendTitle').value='';$('sendBody').value='';$('sendUrl').value='';$('sendFile').value='';renderSent();toast(selectedStudent.name+'へ送りました')}catch(e){toast(e.message)}};
setInterval(()=>{if(session?.role==='teacher'){renderRoster();renderTeacherAll()}},1500);
const saved=read(SESSION,null);if(saved){session=saved;role=saved.role;if(saved.role==='student')openStudent();else openTeacher()}else showView('loginView');
</script>
</body></html>
